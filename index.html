<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f4f7" />
    <meta name="description" content="Fatemeh Pakdaman — portfolio" />
    <title>Fatemeh Pakdaman — Portfolio</title>
    <script>
      // set the theme before first paint: saved choice, else the system setting
      (function () {
        var t;
        try { t = localStorage.getItem('fp-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0b12');
      })();
    </script>
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%hero/working-1200.webp"
      imagesrcset="%BASE_URL%hero/working-720.webp 720w, %BASE_URL%hero/working-1200.webp 1200w"
      imagesizes="(max-width: 767px) 100vw, 860px" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
